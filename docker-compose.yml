services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: always
  backend:
    build:
      context: ./backend
    container_name: iot_backend
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - TZ=Asia/Bangkok
      - DATABASE_URL=sqlite:///./data/iotdb.sqlite3
    volumes:
      - ./data:/app/data
    depends_on:
      - mosquitto
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: iot_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
